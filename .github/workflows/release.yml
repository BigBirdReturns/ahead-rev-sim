name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rtl-attachment:
    name: Requalify executed RTL attachment
    permissions:
      contents: read
    uses: ./.github/workflows/rtl-attachment.yml

  execution-target:
    name: Requalify provider-neutral execution target
    permissions:
      contents: read
    uses: ./.github/workflows/execution-target.yml

  chipyard-lifecycle:
    name: Requalify Chipyard RV64GC lifecycle
    permissions:
      contents: read
    uses: ./.github/workflows/chipyard-lifecycle.yml

  release:
    name: Build, verify, and publish release artifacts
    needs:
      - rtl-attachment
      - execution-target
      - chipyard-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run source admission gates
        run: |
          ruff check src tests scripts
          mypy
          pytest -q
          python scripts/repository_audit.py

      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Seal release manifest and checksums
        run: python scripts/release_preflight.py --dist dist --tag "${GITHUB_REF_NAME}"

      - name: Verify the clean wheel
        run: |
          python -m venv /tmp/ahead-rev-release
          /tmp/ahead-rev-release/bin/python -m pip install --upgrade pip
          /tmp/ahead-rev-release/bin/python -m pip install dist/*.whl
          /tmp/ahead-rev-release/bin/ahead-rev-doctor --strict
          test "$(/tmp/ahead-rev-release/bin/ahead-rev-sim --version)" = "ahead-rev-sim ${GITHUB_REF_NAME#v}"
          test "$(/tmp/ahead-rev-release/bin/ahead-rev-rtl --version)" = "ahead-rev-rtl ${GITHUB_REF_NAME#v}"
          /tmp/ahead-rev-release/bin/ahead-rev-rtl --help >/dev/null
          /tmp/ahead-rev-release/bin/ahead-rev-chipyard lifecycle-bundle --help >/dev/null
          /tmp/ahead-rev-release/bin/ahead-rev-chipyard lifecycle-proof --help >/dev/null
          /tmp/ahead-rev-release/bin/ahead-rev-target --help >/dev/null

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahead-rev-sim-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            --verify-tag \
            --title "ahead-rev-sim ${GITHUB_REF_NAME}" \
            --generate-notes
