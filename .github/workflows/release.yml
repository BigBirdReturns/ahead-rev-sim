name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run source admission gates
        run: |
          ruff check src tests scripts
          mypy
          pytest -q
          python scripts/repository_audit.py

      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Seal release manifest and checksums
        run: python scripts/release_preflight.py --dist dist --tag "${GITHUB_REF_NAME}"

      - name: Verify the clean wheel
        run: |
          python -m venv /tmp/ahead-rev-release
          /tmp/ahead-rev-release/bin/python -m pip install --upgrade pip
          /tmp/ahead-rev-release/bin/python -m pip install dist/*.whl
          /tmp/ahead-rev-release/bin/ahead-rev-doctor --strict
          test "$(/tmp/ahead-rev-release/bin/ahead-rev-sim --version)" = "ahead-rev-sim ${GITHUB_REF_NAME#v}"

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ahead-rev-sim-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            --verify-tag \
            --title "ahead-rev-sim ${GITHUB_REF_NAME}" \
            --generate-notes
