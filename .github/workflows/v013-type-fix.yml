name: v0.13 bounded typing repair

on:
  push:
    branches:
      - agent/v0.13-execution-target-boundary

permissions:
  contents: write

concurrency:
  group: v013-bounded-typing-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Repair demonstrated mypy defects
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.13-execution-target-boundary
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply and validate the bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "dc5f31fc1ab6ea9b06b6fa0cee4ad648cbf49203"
          python - <<'PY'
          from pathlib import Path

          target_path = Path("src/ahead_rev_sim/execution_target.py")
          target = target_path.read_text(encoding="utf-8")
          old_target = '''def _positive_integer(value: Any, field_name: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int) or value < 1:
                  raise ValueError(f"{field_name} must be a positive integer")
              return value
          '''.replace("          ", "")
          new_target = '''def _positive_integer(value: Any, field_name: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int) or value < 1:
                  raise ValueError(f"{field_name} must be a positive integer")
              return int(value)
          '''.replace("          ", "")
          if target.count(old_target) != 1:
              raise SystemExit("positive-integer boundary changed unexpectedly")
          target_path.write_text(target.replace(old_target, new_target), encoding="utf-8")

          cli_path = Path("src/ahead_rev_sim/execution_target_cli.py")
          cli = cli_path.read_text(encoding="utf-8")
          old_import = '''from .execution_target import (
              ReferenceSoftwareTargetAdapter,
          '''.replace("          ", "")
          new_import = '''from .execution_target import (
              ExecutionTargetAdapter,
              ReferenceSoftwareTargetAdapter,
          '''.replace("          ", "")
          if cli.count(old_import) != 1:
              raise SystemExit("execution-target import boundary changed unexpectedly")
          cli = cli.replace(old_import, new_import)
          old_selection = '''        invocation = _load(args.invocation)
                  if args.target == "reference-software":
          '''.replace("          ", "")
          new_selection = '''        invocation = _load(args.invocation)
                  adapter: ExecutionTargetAdapter
                  if args.target == "reference-software":
          '''.replace("          ", "")
          if cli.count(old_selection) != 1:
              raise SystemExit("adapter selection boundary changed unexpectedly")
          cli_path.write_text(cli.replace(old_selection, new_selection), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          mypy
          python scripts/repository_audit.py
          pytest -q
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
          git diff --name-only | sort | diff -u - <(printf '%s\n' \
            src/ahead_rev_sim/execution_target.py \
            src/ahead_rev_sim/execution_target_cli.py \
            | sort)

      - name: Commit and push only the demonstrated repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "BigBirdReturns Evidence Repair"
          git config user.email "219768509+BigBirdReturns@users.noreply.github.com"
          git add \
            src/ahead_rev_sim/execution_target.py \
            src/ahead_rev_sim/execution_target_cli.py
          git commit -m "Fix execution-target typing boundaries"
          git push origin HEAD:agent/v0.13-execution-target-boundary
