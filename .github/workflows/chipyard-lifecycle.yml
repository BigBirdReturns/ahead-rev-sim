name: Chipyard RV64GC Lifecycle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: chipyard-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHIPYARD_COMMIT: e27c6561c0066c1f60bf4eb4885a38391c850ac0
  LIBGLOSS_COMMIT: 39234a16247ab1fa234821b251f1f1870c3de343
  CIRCT_RELEASE: firtool-1.75.0
  CIRCT_INSTALLER_COMMIT: 3f8dda6e1c1965537b5801a43c81c287bac4eae4
  CHIPYARD_CONFIG: PhysicalComputeRocketConfig
  CHIPYARD_CONFIG_PACKAGE: chipyard.physicalcompute
  CHIPYARD_SCALA_PATH: generators/chipyard/src/main/scala/physicalcompute/PhysicalCompute.scala
  ELABORATION_MAKE_COMMAND: make -C chipyard/sims/verilator CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute JAVA_HEAP_SIZE=6G firrtl
  SIMULATOR_BUILD_COMMAND: make -C chipyard/sims/verilator -j2 CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute JAVA_HEAP_SIZE=6G default
  SIMULATOR_RUN_COMMAND: make -C chipyard/sims/verilator CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute BINARY=physical_compute_chipyard_lifecycle.riscv run-binary-fast

jobs:
  chipyard-lifecycle:
    name: Pinned Chipyard Verilator and RV64GC lifecycle proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out ahead-rev-sim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ahead-rev-sim and validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Generate and validate the authority bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/chipyard-lifecycle
          "$pythonLocation/bin/ahead-rev-chipyard" bundle \
            --out-dir artifacts/chipyard-lifecycle \
            2>&1 | tee artifacts/chipyard-lifecycle/injector-bundle.txt
          "$pythonLocation/bin/ahead-rev-chipyard" lifecycle-bundle \
            --out-dir artifacts/chipyard-lifecycle \
            2>&1 | tee artifacts/chipyard-lifecycle/lifecycle-bundle.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("artifacts/chipyard-lifecycle")
          pairs = (
              (
                  root / "chipyard-physical-compute-integration.json",
                  Path("schemas/chipyard-physical-compute-integration.schema.json"),
              ),
              (
                  root / "chipyard-rv64gc-lifecycle-manifest.json",
                  Path("schemas/chipyard-rv64gc-lifecycle-manifest.schema.json"),
              ),
          )
          for document_path, schema_path in pairs:
              document = json.loads(document_path.read_text(encoding="utf-8"))
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(document)
          lifecycle = json.loads(pairs[1][0].read_text(encoding="utf-8"))
          assert lifecycle["chipyard"]["commit"] == (
              "e27c6561c0066c1f60bf4eb4885a38391c850ac0"
          )
          assert lifecycle["target"]["isa"] == "rv64gc"
          assert lifecycle["target"]["loopback_fallback"] is True
          assert lifecycle["qualification"][
              "chipyard_rtl_simulation_claim_allowed"
          ] is False
          PY

      - name: Clone the exact Chipyard authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/ucb-bar/chipyard.git chipyard
          git -C chipyard fetch --depth=1 origin "$CHIPYARD_COMMIT"
          git -C chipyard checkout --detach "$CHIPYARD_COMMIT"
          test "$(git -C chipyard rev-parse HEAD)" = "$CHIPYARD_COMMIT"
          git -C chipyard status --short --branch \
            | tee artifacts/chipyard-lifecycle/chipyard-checkout.txt

      - name: Make Conda available for the upstream setup
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-activate: true
          activate-environment: ""

      - name: Install the lean pinned Chipyard environment
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          ./build-setup.sh \
            --use-lean-conda \
            --skip-submodules \
            --skip-toolchain \
            --skip-precompile \
            --skip-clean \
            2>&1 | tee ../artifacts/chipyard-lifecycle/build-setup.log

      - name: Verify the pinned CIRCT lowering authority
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          FIRTOOL="$(command -v firtool)"
          test "$(jq -r .version conda-reqs/circt.json)" = "$CIRCT_RELEASE"
          test "$(git -C tools/install-circt rev-parse HEAD)" = \
            "$CIRCT_INSTALLER_COMMIT"
          test -n "$FIRTOOL"
          test -x "$FIRTOOL"
          case "$FIRTOOL" in
            "$CONDA_PREFIX"/riscv-tools/bin/*) ;;
            *)
              echo "firtool resolved outside the pinned Chipyard prefix: $FIRTOOL" >&2
              exit 1
              ;;
          esac
          firtool --version 2>&1 | tee "$ROOT/firtool-version.txt"
          cp conda-reqs/circt.json "$ROOT/circt.json"
          git -C tools/install-circt rev-parse HEAD \
            > "$ROOT/install-circt-revision.txt"
          {
            printf 'circt_repository=llvm/circt\n'
            printf 'circt_release=%s\n' "$CIRCT_RELEASE"
            printf 'installer_repository=circt/install-circt\n'
            printf 'installer_commit=%s\n' "$CIRCT_INSTALLER_COMMIT"
            printf 'firtool_path=%s\n' "$FIRTOOL"
            sha256sum "$FIRTOOL" conda-reqs/circt.json
          } | tee "$ROOT/firtool-authority.txt"

      - name: Initialize the pinned submodules and install the peripheral
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          git config --local submodule.software/spec2026.update none
          ./scripts/init-submodules-no-riscv-tools.sh \
            2>&1 | tee ../artifacts/chipyard-lifecycle/submodules.log
          git submodule update --init toolchains/libgloss \
            2>&1 | tee -a ../artifacts/chipyard-lifecycle/submodules.log
          test "$(git -C toolchains/libgloss rev-parse HEAD)" = "$LIBGLOSS_COMMIT"
          git submodule status --recursive \
            > ../artifacts/chipyard-lifecycle/submodule-status.txt
          grep -E '^ [0-9a-f]{40} generators/testchipip([[:space:]]|$)' \
            ../artifacts/chipyard-lifecycle/submodule-status.txt
          grep -E '^ [0-9a-f]{40} generators/rocket-chip([[:space:]]|$)' \
            ../artifacts/chipyard-lifecycle/submodule-status.txt
          grep -E "^ ${LIBGLOSS_COMMIT} toolchains/libgloss([[:space:]]|$)" \
            ../artifacts/chipyard-lifecycle/submodule-status.txt
          mkdir -p "$(dirname "$CHIPYARD_SCALA_PATH")"
          cp ../artifacts/chipyard-lifecycle/PhysicalCompute.scala \
            "$CHIPYARD_SCALA_PATH"
          cmp ../artifacts/chipyard-lifecycle/PhysicalCompute.scala \
            "$CHIPYARD_SCALA_PATH"
          git diff -- generators/chipyard/src/main/scala/DigitalTop.scala \
            > ../artifacts/chipyard-lifecycle/digital-top.diff
          test ! -s ../artifacts/chipyard-lifecycle/digital-top.diff

      - name: Build and verify the pinned HTIF runtime
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          SYSROOT="$(riscv64-unknown-elf-gcc -print-sysroot)"
          BUILD_DIR="$GITHUB_WORKSPACE/chipyard/.libgloss-build"
          test "$(git -C toolchains/libgloss rev-parse HEAD)" = "$LIBGLOSS_COMMIT"
          test -n "$SYSROOT"
          test -d "$SYSROOT"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          (
            cd "$BUILD_DIR"
            "$GITHUB_WORKSPACE/chipyard/toolchains/libgloss/configure" \
              --prefix="$SYSROOT" \
              --host=riscv64-unknown-elf \
              2>&1 | tee "$ROOT/libgloss-configure.log"
            make -j2 2>&1 | tee "$ROOT/libgloss-build.log"
            make install 2>&1 | tee "$ROOT/libgloss-install.log"
          )
          SPEC_FILE="$(riscv64-unknown-elf-gcc \
            -print-file-name=htif_nano.specs)"
          LINKER_SCRIPT="$(riscv64-unknown-elf-gcc -print-file-name=htif.ld)"
          test "$SPEC_FILE" != "htif_nano.specs"
          test "$LINKER_SCRIPT" != "htif.ld"
          test -s "$SPEC_FILE"
          test -s "$LINKER_SCRIPT"
          riscv64-unknown-elf-gcc -print-search-dirs \
            > "$ROOT/compiler-search-dirs.txt"
          {
            printf 'libgloss_commit=%s\n' "$LIBGLOSS_COMMIT"
            printf 'conda_prefix=%s\n' "$CONDA_PREFIX"
            printf 'compiler_sysroot=%s\n' \
              "$(riscv64-unknown-elf-gcc -print-sysroot)"
            printf 'htif_nano_specs=%s\n' "$SPEC_FILE"
            printf 'htif_linker_script=%s\n' "$LINKER_SCRIPT"
            sha256sum "$SPEC_FILE" "$LINKER_SCRIPT"
          } | tee "$ROOT/htif-runtime.txt"

      - name: Build the generated RV64GC lifecycle binary
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          SOURCE="$ROOT/physical_compute_chipyard_lifecycle.c"
          OBJECT="$ROOT/physical_compute_chipyard_lifecycle.o"
          BINARY="$ROOT/physical_compute_chipyard_lifecycle.riscv"
          riscv64-unknown-elf-gcc --version \
            2>&1 | tee "$ROOT/compiler-version.txt"
          riscv64-unknown-elf-readelf --version > "$ROOT/readelf.txt"
          riscv64-unknown-elf-gcc \
            -std=gnu99 -O2 -Wall -Wextra -Werror \
            -fno-common -fno-builtin-printf \
            -march=rv64gc -mabi=lp64d -mcmodel=medany \
            -specs=htif_nano.specs \
            -c "$SOURCE" -o "$OBJECT"
          riscv64-unknown-elf-gcc \
            -static -march=rv64gc -mabi=lp64d -mcmodel=medany \
            -specs=htif_nano.specs \
            "$OBJECT" -o "$BINARY"
          riscv64-unknown-elf-readelf -h "$BINARY" >> "$ROOT/readelf.txt"
          riscv64-unknown-elf-objdump -D "$BINARY" \
            > "$ROOT/physical_compute_chipyard_lifecycle.dump"
          riscv64-unknown-elf-size "$BINARY" | tee "$ROOT/binary-size.txt"
          test -s "$BINARY"
          grep -q 'Class:.*ELF64' "$ROOT/readelf.txt"
          grep -q 'Machine:.*RISC-V' "$ROOT/readelf.txt"

      - name: Elaborate and seal the pinned subsystem proof
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          java -version 2>&1 | tee "$ROOT/java-version.txt"
          sbt --script-version 2>&1 | tee "$ROOT/sbt-version.txt"
          verilator --version 2>&1 | tee "$ROOT/verilator-version.txt"
          make -C sims/verilator \
            CONFIG="$CHIPYARD_CONFIG" \
            CONFIG_PACKAGE="$CHIPYARD_CONFIG_PACKAGE" \
            JAVA_HEAP_SIZE=6G firrtl \
            2>&1 | tee "$ROOT/elaboration.log"
          FIRRTL_FILE="$(find sims/verilator/generated-src \
            -type f -name "*${CHIPYARD_CONFIG}*.fir" -print -quit)"
          ANNO_FILE="$(find sims/verilator/generated-src \
            -type f -name "*${CHIPYARD_CONFIG}*.anno.json" -print -quit)"
          CHISEL_LOG_FILE="$(find sims/verilator/generated-src \
            -type f -name "*${CHIPYARD_CONFIG}*.chisel.log" -print -quit)"
          test -n "$FIRRTL_FILE" && test -s "$FIRRTL_FILE"
          test -n "$ANNO_FILE" && test -s "$ANNO_FILE"
          test -n "$CHISEL_LOG_FILE" && test -s "$CHISEL_LOG_FILE"
          cp "$FIRRTL_FILE" "$ANNO_FILE" "$CHISEL_LOG_FILE" "$ROOT/"
          "$pythonLocation/bin/ahead-rev-chipyard" proof \
            --checkout-root "$GITHUB_WORKSPACE/chipyard" \
            --manifest "$ROOT/chipyard-physical-compute-integration.json" \
            --scala "$GITHUB_WORKSPACE/chipyard/$CHIPYARD_SCALA_PATH" \
            --firrtl "$FIRRTL_FILE" \
            --annotations "$ANNO_FILE" \
            --chisel-log "$CHISEL_LOG_FILE" \
            --elaboration-log "$ROOT/elaboration.log" \
            --java-version-file "$ROOT/java-version.txt" \
            --sbt-version-file "$ROOT/sbt-version.txt" \
            --make-command "$ELABORATION_MAKE_COMMAND" \
            --out "$ROOT/chipyard-subsystem-elaboration-proof.json" \
            2>&1 | tee "$ROOT/elaboration-proof.txt"
          test -s "$ROOT/chipyard-subsystem-elaboration-proof.json"

      - name: Build Verilator and execute the lifecycle
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          BINARY="$ROOT/physical_compute_chipyard_lifecycle.riscv"
          make -C sims/verilator -j2 \
            CONFIG="$CHIPYARD_CONFIG" \
            CONFIG_PACKAGE="$CHIPYARD_CONFIG_PACKAGE" \
            JAVA_HEAP_SIZE=6G default \
            2>&1 | tee "$ROOT/simulator-build.log"
          SIMULATOR="$(find sims/verilator -maxdepth 1 -type f \
            -name "simulator-*${CHIPYARD_CONFIG}" -perm -111 -print -quit)"
          test -n "$SIMULATOR" && test -s "$SIMULATOR"
          cp "$SIMULATOR" "$ROOT/"
          printf '%s\n' "$SIMULATOR" > "$ROOT/simulator-source-path.txt"
          timeout 300s make -C sims/verilator \
            CONFIG="$CHIPYARD_CONFIG" \
            CONFIG_PACKAGE="$CHIPYARD_CONFIG_PACKAGE" \
            JAVA_HEAP_SIZE=6G BINARY="$BINARY" run-binary-fast \
            2>&1 | tee "$ROOT/chipyard-lifecycle.raw.log"

      - name: Prove lifecycle trace refusal and seal the lifecycle proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="artifacts/chipyard-lifecycle"
          grep '^ahead-chipyard:' "$ROOT/chipyard-lifecycle.raw.log" \
            | sed 's/\r$//' > "$ROOT/chipyard-lifecycle.trace"
          diff -u "$ROOT/physical_compute_chipyard_lifecycle.expected" \
            "$ROOT/chipyard-lifecycle.trace" \
            | tee "$ROOT/chipyard-lifecycle.diff"
          test ! -s "$ROOT/chipyard-lifecycle.diff"
          SIMULATOR="$(find "$ROOT" -maxdepth 1 -type f \
            -name "simulator-*${CHIPYARD_CONFIG}" -print -quit)"
          test -n "$SIMULATOR" && test -s "$SIMULATOR"
          "$pythonLocation/bin/ahead-rev-chipyard" lifecycle-proof \
            --integration-manifest \
              "$ROOT/chipyard-physical-compute-integration.json" \
            --lifecycle-manifest \
              "$ROOT/chipyard-rv64gc-lifecycle-manifest.json" \
            --elaboration-proof \
              "$ROOT/chipyard-subsystem-elaboration-proof.json" \
            --source "$ROOT/physical_compute_chipyard_lifecycle.c" \
            --expected "$ROOT/physical_compute_chipyard_lifecycle.expected" \
            --binary "$ROOT/physical_compute_chipyard_lifecycle.riscv" \
            --simulator "$SIMULATOR" \
            --simulator-build-log "$ROOT/simulator-build.log" \
            --raw-log "$ROOT/chipyard-lifecycle.raw.log" \
            --trace "$ROOT/chipyard-lifecycle.trace" \
            --compiler-version-file "$ROOT/compiler-version.txt" \
            --readelf-file "$ROOT/readelf.txt" \
            --verilator-version-file "$ROOT/verilator-version.txt" \
            --build-command "$SIMULATOR_BUILD_COMMAND" \
            --run-command "$SIMULATOR_RUN_COMMAND" \
            --out "$ROOT/chipyard-rv64gc-lifecycle-proof.json" \
            2>&1 | tee "$ROOT/lifecycle-proof.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          proof = json.loads(
              Path(
                  "artifacts/chipyard-lifecycle/"
                  "chipyard-rv64gc-lifecycle-proof.json"
              ).read_text(encoding="utf-8")
          )
          schema = json.loads(
              Path(
                  "schemas/chipyard-rv64gc-lifecycle-proof.schema.json"
              ).read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(proof)
          qualification = proof["qualification"]
          assert qualification["accepted"] is True
          assert qualification["chipyard_rtl_simulation_claim_allowed"] is True
          assert qualification["external_cartridge_claim_allowed"] is False
          assert qualification["physical_claim_allowed"] is False
          assert "CHIPYARD_RTL_SIMULATION_UNRUN" not in qualification["blockers"]
          assert "FPGA_OR_SILICON_EXECUTION_UNRUN" in qualification["blockers"]
          PY
          cp "$ROOT/chipyard-lifecycle.trace" "$ROOT/tampered.trace"
          sed -i 's/result=pass/result=fail/' "$ROOT/tampered.trace"
          if "$pythonLocation/bin/ahead-rev-chipyard" lifecycle-proof \
            --integration-manifest \
              "$ROOT/chipyard-physical-compute-integration.json" \
            --lifecycle-manifest \
              "$ROOT/chipyard-rv64gc-lifecycle-manifest.json" \
            --elaboration-proof \
              "$ROOT/chipyard-subsystem-elaboration-proof.json" \
            --source "$ROOT/physical_compute_chipyard_lifecycle.c" \
            --expected "$ROOT/physical_compute_chipyard_lifecycle.expected" \
            --binary "$ROOT/physical_compute_chipyard_lifecycle.riscv" \
            --simulator "$SIMULATOR" \
            --simulator-build-log "$ROOT/simulator-build.log" \
            --raw-log "$ROOT/chipyard-lifecycle.raw.log" \
            --trace "$ROOT/tampered.trace" \
            --compiler-version-file "$ROOT/compiler-version.txt" \
            --readelf-file "$ROOT/readelf.txt" \
            --verilator-version-file "$ROOT/verilator-version.txt" \
            --build-command "$SIMULATOR_BUILD_COMMAND" \
            --run-command "$SIMULATOR_RUN_COMMAND" \
            --out "$ROOT/refused-lifecycle-proof.json"; then
            echo "tampered lifecycle trace unexpectedly admitted" >&2
            exit 1
          fi
          test ! -e "$ROOT/refused-lifecycle-proof.json"

      - name: Run the focused repository gates
        run: |
          python -m pytest -q \
            tests/test_chipyard_integration.py \
            tests/test_chipyard_elaboration.py \
            tests/test_chipyard_workflow_environment.py \
            tests/test_chipyard_setup_witness.py \
            tests/test_chipyard_lifecycle.py \
            tests/test_release_workflow.py

      - name: Assemble the reconstructable lifecycle kit
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="artifacts/chipyard-lifecycle"
          mkdir -p "$ROOT/kit/schemas"
          cp docs/chipyard_rv64gc_lifecycle.md "$ROOT/kit/"
          cp schemas/chipyard-physical-compute-integration.schema.json \
            schemas/chipyard-subsystem-elaboration-proof.schema.json \
            schemas/chipyard-rv64gc-lifecycle-manifest.schema.json \
            schemas/chipyard-rv64gc-lifecycle-proof.schema.json \
            "$ROOT/kit/schemas/"
          find "$ROOT" -maxdepth 1 -type f -print | sort \
            > "$ROOT/kit/root-artifacts.txt"
          while IFS= read -r file; do sha256sum "$file"; done \
            < "$ROOT/kit/root-artifacts.txt" \
            > "$ROOT/kit/root-artifacts.sha256"

      - name: Collect generated products after any outcome
        if: always()
        shell: bash
        run: |
          ROOT="artifacts/chipyard-lifecycle"
          mkdir -p "$ROOT"
          if test -d chipyard/sims/verilator/generated-src; then
            find chipyard/sims/verilator/generated-src -maxdepth 3 \
              -type f -print | sort > "$ROOT/generated-products.txt"
            tar -C chipyard/sims/verilator \
              -czf "$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle/generated-src.tar.gz" \
              generated-src 2> "$ROOT/generated-src-tar.stderr" || true
          else
            : > "$ROOT/generated-products.txt"
          fi
          find "$ROOT" -maxdepth 1 -type f -exec sha256sum {} \; \
            | sort > "$ROOT/SHA256SUMS" || true

      - name: Upload Chipyard lifecycle evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chipyard-lifecycle-${{ github.sha }}
          path: artifacts/chipyard-lifecycle
          if-no-files-found: warn
          retention-days: 30
