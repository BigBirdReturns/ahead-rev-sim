name: Chipyard RV64GC Lifecycle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: chipyard-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHIPYARD_COMMIT: e27c6561c0066c1f60bf4eb4885a38391c850ac0
  LIBGLOSS_COMMIT: 39234a16247ab1fa234821b251f1f1870c3de343
  CIRCT_RELEASE: firtool-1.75.0
  CIRCT_INSTALLER_COMMIT: 3f8dda6e1c1965537b5801a43c81c287bac4eae4
  CHIPYARD_CONFIG: PhysicalComputeRocketConfig
  CHIPYARD_CONFIG_PACKAGE: chipyard.physicalcompute
  CHIPYARD_SCALA_PATH: generators/chipyard/src/main/scala/physicalcompute/PhysicalCompute.scala
  ELABORATION_MAKE_COMMAND: make -C chipyard/sims/verilator CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute JAVA_HEAP_SIZE=6G firrtl
  SIMULATOR_BUILD_COMMAND: make -C chipyard/sims/verilator -j2 CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute JAVA_HEAP_SIZE=6G default
  SIMULATOR_RUN_COMMAND: make -C chipyard/sims/verilator CONFIG=PhysicalComputeRocketConfig CONFIG_PACKAGE=chipyard.physicalcompute BINARY=physical_compute_chipyard_lifecycle.riscv run-binary-fast

jobs:
  chipyard-lifecycle:
    name: Pinned Chipyard Verilator and RV64GC lifecycle proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out ahead-rev-sim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ahead-rev-sim and validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Generate and validate the authority bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/chipyard-lifecycle
          "$pythonLocation/bin/ahead-rev-chipyard" bundle \
            --out-dir artifacts/chipyard-lifecycle \
            2>&1 | tee artifacts/chipyard-lifecycle/injector-bundle.txt
          "$pythonLocation/bin/ahead-rev-chipyard" lifecycle-bundle \
            --out-dir artifacts/chipyard-lifecycle \
            2>&1 | tee artifacts/chipyard-lifecycle/lifecycle-bundle.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("artifacts/chipyard-lifecycle")
          pairs = (
              (
                  root / "chipyard-physical-compute-integration.json",
                  Path("schemas/chipyard-physical-compute-integration.schema.json"),
              ),
              (
                  root / "chipyard-rv64gc-lifecycle-manifest.json",
                  Path("schemas/chipyard-rv64gc-lifecycle-manifest.schema.json"),
              ),
          )
          for document_path, schema_path in pairs:
              document = json.loads(document_path.read_text(encoding="utf-8"))
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(document)
          lifecycle = json.loads(pairs[1][0].read_text(encoding="utf-8"))
          assert lifecycle["chipyard"]["commit"] == (
              "e27c6561c0066c1f60bf4eb4885a38391c850ac0"
          )
          assert lifecycle["target"]["isa"] == "rv64gc"
          assert lifecycle["target"]["loopback_fallback"] is True
          assert lifecycle["qualification"][
              "chipyard_rtl_simulation_claim_allowed"
          ] is False
          PY

      - name: Clone the exact Chipyard authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/ucb-bar/chipyard.git chipyard
          git -C chipyard fetch --depth=1 origin "$CHIPYARD_COMMIT"
          git -C chipyard checkout --detach "$CHIPYARD_COMMIT"
          test "$(git -C chipyard rev-parse HEAD)" = "$CHIPYARD_COMMIT"
          git -C chipyard status --short --branch \
            | tee artifacts/chipyard-lifecycle/chipyard-checkout.txt

      - name: Make Conda available for the upstream setup
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-activate: true
          activate-environment: ""

      - name: Install the lean pinned Chipyard environment
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          ./build-setup.sh \
            --use-lean-conda \
            --skip-submodules \
            --skip-toolchain \
            --skip-precompile \
            --skip-clean \
            2>&1 | tee ../artifacts/chipyard-lifecycle/build-setup.log

      - name: Verify the pinned CIRCT lowering authority
        shell: bash -el {0}
        run: |
          set -Eeo pipefail
          cd chipyard
          source env.sh
          ROOT="$GITHUB_WORKSPACE/artifacts/chipyard-lifecycle"
          FIRTOOL="$(command -v firtool)"
          test "$(jq -r .version conda-reqs/circt.json)" = "$CIRCT_RELEASE"
          test "$(git -C tools/install-circt rev-parse HEAD)" = \
            "$CIRCT_INSTALLER_COMMIT"
          test -n "$FIRTOOL"
          test -x "$FIRTOOL"
          case "$FIRTOOL" in
            "$CONDA_PREFIX"/riscv-tools/bin/*) ;;
            *)
              echo "firtool resolved outside the pinned Chipyard prefix: $FIRTOOL" >&2
              exit 1
              ;;
          esac
          firtool --version 2>&1 | tee "$ROOT/firtool-version.txt"
