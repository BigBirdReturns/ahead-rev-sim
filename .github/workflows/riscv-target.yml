name: RISC-V Target Model

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: riscv-target-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rv64gc-mmio:
    name: RV64GC MMIO lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ahead-rev-sim
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install RISC-V compiler, libc headers, and emulator
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            qemu-user

      - name: Generate portable MMIO header
        run: |
          mkdir -p artifacts/riscv-target
          ahead-rev-mmio \
            --format c-header \
            --out artifacts/riscv-target/ahead_physical_compute_mmio_v1.h

      - name: Build static RV64GC lifecycle binary
        run: |
          riscv64-linux-gnu-gcc \
            -static \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -march=rv64gc \
            -mabi=lp64d \
            -I artifacts/riscv-target \
            examples/riscv/mmio_target_smoke.c \
            -o artifacts/riscv-target/mmio_target_smoke.riscv64
          riscv64-linux-gnu-readelf \
            -h artifacts/riscv-target/mmio_target_smoke.riscv64 \
            | tee artifacts/riscv-target/readelf.txt
          grep -q "Class:.*ELF64" artifacts/riscv-target/readelf.txt
          grep -q "Machine:.*RISC-V" artifacts/riscv-target/readelf.txt

      - name: Execute accepted trace under qemu-riscv64
        run: |
          qemu-riscv64 artifacts/riscv-target/mmio_target_smoke.riscv64 \
            | tee artifacts/riscv-target/mmio_target_smoke.trace
          diff -u \
            examples/riscv/mmio_target_smoke.expected \
            artifacts/riscv-target/mmio_target_smoke.trace

      - name: Seal RISC-V target proof
        run: |
          ahead-rev-riscv-target-proof \
            --binary artifacts/riscv-target/mmio_target_smoke.riscv64 \
            --trace artifacts/riscv-target/mmio_target_smoke.trace \
            --expected examples/riscv/mmio_target_smoke.expected \
            --out artifacts/riscv-target/riscv-target-proof.json
          diff -u \
            examples/hitches/reference-riscv-target-proof.json \
            artifacts/riscv-target/riscv-target-proof.json

      - name: Compose admitted reference consist
        run: |
          ahead-rev-hitch \
            --host examples/hitches/reference-rv64gc-host.hitch.json \
            --cartridge examples/hitches/reference-loopback-cartridge.hitch.json \
            --out artifacts/riscv-target/reference.consist.json \
            --require-admitted
          diff -u \
            examples/hitches/reference.consist.json \
            artifacts/riscv-target/reference.consist.json

      - name: Bind target execution to provider consist
        run: |
          ahead-rev-consist-proof \
            --consist artifacts/riscv-target/reference.consist.json \
            --host-hitch examples/hitches/reference-rv64gc-host.hitch.json \
            --cartridge-hitch examples/hitches/reference-loopback-cartridge.hitch.json \
            --target-proof artifacts/riscv-target/riscv-target-proof.json \
            --out artifacts/riscv-target/reference-consist-execution-proof.json
          diff -u \
            examples/hitches/reference-consist-execution-proof.json \
            artifacts/riscv-target/reference-consist-execution-proof.json

      - name: Upload target evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riscv-target-${{ github.sha }}
          path: artifacts/riscv-target
          if-no-files-found: error
          retention-days: 30
