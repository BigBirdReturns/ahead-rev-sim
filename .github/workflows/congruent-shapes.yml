name: Congruent Shape Pylons

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pylon-atlas:
    name: Commodity congruence and design-pylon qualification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ahead-rev-sim
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Generate complete congruent-shape atlas
        run: |
          mkdir -p artifacts/congruent-shapes
          ahead-rev-pylons \
            --out artifacts/congruent-shapes/congruent-shape-atlas.json \
            --format text \
            --require-complete \
            > artifacts/congruent-shapes/congruent-shape-atlas.txt

      - name: Validate pylon and atlas schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          catalog = json.loads(
              Path("src/ahead_rev_sim/data/congruent_shape_pylons.json")
              .read_text(encoding="utf-8")
          )
          atlas = json.loads(
              Path("artifacts/congruent-shapes/congruent-shape-atlas.json")
              .read_text(encoding="utf-8")
          )
          catalog_schema = json.loads(
              Path("schemas/congruent-shape-pylon-catalog.schema.json")
              .read_text(encoding="utf-8")
          )
          atlas_schema = json.loads(
              Path("schemas/congruent-shape-atlas.schema.json")
              .read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(catalog_schema)
          Draft202012Validator.check_schema(atlas_schema)
          Draft202012Validator(catalog_schema).validate(catalog)
          Draft202012Validator(atlas_schema).validate(atlas)
          PY

      - name: Enforce complete registry and gap projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          atlas = json.loads(
              Path("artifacts/congruent-shapes/congruent-shape-atlas.json")
              .read_text(encoding="utf-8")
          )
          summary = atlas["summary"]
          assert summary["record_count"] == 73
          assert summary["registry_record_count"] == 73
          assert summary["pylon_count"] == 19
          assert summary["foundation_pylon_count"] == 4
          assert summary["domain_pylon_count"] == 15
          assert summary["registry_gap_count"] == 26
          assert summary["selected_gap_count"] == 26
          assert summary["all_selected_records_covered"] is True
          assert summary["selected_gap_coverage_complete"] is True
          assert summary["minimum_foundation_pylons_per_record"] == 4
          assert summary["minimum_domain_pylons_per_record"] >= 2
          assert summary["cross_domain_witness_pair_count"] >= 19
          assert len(atlas["atlas_sha256"]) == 64
          for coverage in atlas["pylon_coverage"]:
              assert coverage["cross_domain_witness_pairs"]
          PY

      - name: Assemble pylon design kit
        run: |
          mkdir -p artifacts/congruent-shapes/kit/data
          mkdir -p artifacts/congruent-shapes/kit/schemas
          cp docs/congruent_shape_pylons.md artifacts/congruent-shapes/kit/
          cp \
            src/ahead_rev_sim/data/congruent_shape_pylons.json \
            artifacts/congruent-shapes/congruent-shape-atlas.json \
            artifacts/congruent-shapes/kit/data/
          cp \
            schemas/congruent-shape-pylon-catalog.schema.json \
            schemas/congruent-shape-atlas.schema.json \
            artifacts/congruent-shapes/kit/schemas/

      - name: Upload pylon evidence
        uses: actions/upload-artifact@v4
        with:
          name: congruent-shape-pylons-${{ github.sha }}
          path: artifacts/congruent-shapes
          if-no-files-found: error
          retention-days: 30
