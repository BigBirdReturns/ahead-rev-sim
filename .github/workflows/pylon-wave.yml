name: Pylon Fan-out Wave

on:
  pull_request:
  push:
    branches:
      - agent/v0.12-chipyard-rv64gc-lifecycle

permissions:
  contents: write

concurrency:
  group: pr11-bounded-finalization-controller
  cancel-in-progress: true

jobs:
  pylon-wave:
    name: Close PR 11 proof and artifact custody
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.12-chipyard-rv64gc-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Execute the bounded finalization transaction
        run: python .staging/pr11-finalize.py
