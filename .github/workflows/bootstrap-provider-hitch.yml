name: Bootstrap Provider Hitch Train

on:
  push:
    branches:
      - agent/v0.9-provider-hitch-staging

permissions:
  contents: write

concurrency:
  group: provider-hitch-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Reconstruct and verify the publication archive
        run: |
          cat .bootstrap/hitch_publish.b64.part* \
            | base64 --decode \
            > /tmp/hitch_publish.tar.gz
          echo "b400f12a97098582a3a150061b78aec69f8f79384fe1de8963847e98b4db71c6  /tmp/hitch_publish.tar.gz" \
            | sha256sum --check --strict
          tar -tzf /tmp/hitch_publish.tar.gz

      - name: Install the provider hitch train
        run: |
          tar -xzf /tmp/hitch_publish.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-provider-hitch.yml

      - name: Qualify the extracted estate before publication
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          pytest -q
          git diff --check

      - name: Publish one qualified commit to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add provider-neutral Ahead and Vaire hitch surface"
          git push origin "HEAD:${{ github.ref_name }}"
