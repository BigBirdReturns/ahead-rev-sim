name: PR 11 evidence staging

on:
  pull_request:
    types:
      - synchronize
  push:
    branches:
      - agent/v0.12-chipyard-rv64gc-lifecycle

permissions:
  contents: write

concurrency:
  group: pr11-evidence-staging
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.12-chipyard-rv64gc-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and stage the sealed evidence tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "d49ddfe0be130fe43e9b1a46071861e419ce48a5"
          git merge-base --is-ancestor \
            19d45ab84b2d6955b894b601efb7a56ed553c996 HEAD
          mkdir -p /tmp/pr11-stage
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          part0_path = Path(".staging/pr11-stage-payload.part0")
          part1_path = Path(".staging/pr11-stage-payload.part1")
          expected_part0 = (
              "9718697480f7ba2a3428ef1c6648dc43"
              "c42bac7b8936a1d0dda7641714ed29d6"
          )
          expected_part1 = (
              "23b94d7555bf25aad4cf3ba85b737ae3"
              "8217471869b96982ddd0fe8d81356437"
          )
          expected_archive = (
              "3bb0e7365a2846b86fe282a76566e2b4"
              "8fb11598ab443ada8f407a55ca2f7bbd"
          )
          expected_members = {
              "nonworkflow.patch": (
                  "9c57a8d1510d1e53fc691f189642b86b"
                  "f5b90d5d79aafeb73ab3f14b59cde416"
              ),
              "chipyard-lifecycle.yml": (
                  "d60dce4ca33962b4d8106747f1e41ecf"
                  "aa5c4a44b71b60077841e7b3e170314c"
              ),
          }

          raw0 = part0_path.read_bytes()
          raw1 = part1_path.read_bytes()
          actual0 = hashlib.sha256(raw0).hexdigest()
          actual1 = hashlib.sha256(raw1).hexdigest()
          print(f"part0_bytes={len(raw0)} part0_sha256={actual0}")
          print(f"part1_bytes={len(raw1)} part1_sha256={actual1}")
          if actual1 != expected_part1:
              raise SystemExit("part1 no longer matches its sealed witness")

          recovered = []
          for index in range(len(raw0)):
              candidate = raw0[:index] + raw0[index + 1 :]
              if hashlib.sha256(candidate).hexdigest() == expected_part0:
                  recovered.append((index, raw0[index], candidate))
          if len(recovered) != 1:
              raise SystemExit(
                  f"expected one single-byte deletion recovery, found {len(recovered)}"
              )
          index, removed, corrected0 = recovered[0]
          print(
              f"recovered_part0 removed_index={index} removed_byte=0x{removed:02x} "
              f"corrected_bytes={len(corrected0)}"
          )
          if hashlib.sha256(corrected0).hexdigest() != expected_part0:
              raise SystemExit("recovered part0 failed its sealed witness")

          encoded = b"".join(corrected0.split()) + b"".join(raw1.split())
          payload = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(payload).hexdigest()
          print(
              f"archive_bytes={len(payload)} archive_sha256={archive_digest}"
          )
          if archive_digest != expected_archive:
              raise SystemExit("recovered archive failed its sealed witness")

          destination = Path("/tmp/pr11-stage")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if set(names) != set(expected_members) or len(names) != len(
                  expected_members
              ):
                  raise SystemExit(f"unexpected archive members: {names}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      not member.isfile()
                      or path.is_absolute()
                      or ".." in path.parts
                      or len(path.parts) != 1
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"unreadable archive member: {member.name}")
                  content = source.read()
                  digest = hashlib.sha256(content).hexdigest()
                  print(
                      f"member={member.name} bytes={len(content)} sha256={digest}"
                  )
                  if digest != expected_members[member.name]:
                      raise SystemExit(
                          f"archive member failed its witness: {member.name}"
                      )
                  (destination / member.name).write_bytes(content)
          PY
          git apply --check /tmp/pr11-stage/nonworkflow.patch
          git apply /tmp/pr11-stage/nonworkflow.patch
          cp /tmp/pr11-stage/chipyard-lifecycle.yml \
            .staging/pr11-chipyard-lifecycle.yml
          printf '%s  %s\n' \
            'd60dce4ca33962b4d8106747f1e41ecfaa5c4a44b71b60077841e7b3e170314c' \
            '.staging/pr11-chipyard-lifecycle.yml' | sha256sum -c -
          git rm \
            .staging/pr11-stage-payload.part0 \
            .staging/pr11-stage-payload.part1
          git diff --check
          git config user.name 'BigBirdReturns Evidence Stager'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add \
            .staging/pr11-chipyard-lifecycle.yml \
            docs/chipyard_rv64gc_lifecycle.md \
            schemas/chipyard-rv64gc-lifecycle-manifest.schema.json \
            schemas/chipyard-rv64gc-lifecycle-proof.schema.json \
            src/ahead_rev_sim/chipyard_cli.py \
            src/ahead_rev_sim/chipyard_lifecycle.py \
            src/ahead_rev_sim/chipyard_lifecycle_manifest.py \
            src/ahead_rev_sim/chipyard_lifecycle_program.py \
            src/ahead_rev_sim/chipyard_lifecycle_proof.py \
            tests/test_chipyard_lifecycle.py \
            tests/test_release_workflow.py
          git commit -m 'Stage sealed Chipyard lifecycle evidence blobs'
          git push origin HEAD:agent/v0.12-chipyard-rv64gc-lifecycle
          git rev-parse HEAD
