name: PR 11 evidence staging

on:
  pull_request:
    types:
      - synchronize
  push:
    branches:
      - agent/v0.12-chipyard-rv64gc-lifecycle

permissions:
  contents: write

concurrency:
  group: pr11-evidence-staging
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.12-chipyard-rv64gc-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose the staged evidence transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "06d3cb3bc3a4aa016b26edc833bf806b35ce6116"
          git merge-base --is-ancestor \
            19d45ab84b2d6955b894b601efb7a56ed553c996 HEAD
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = (
              Path(".staging/pr11-stage-payload.part0"),
              Path(".staging/pr11-stage-payload.part1"),
          )
          for path in parts:
              raw = path.read_bytes()
              print(
                  f"part={path.name} bytes={len(raw)} "
                  f"sha256={hashlib.sha256(raw).hexdigest()}"
              )

          encoded = "".join(
              "".join(path.read_text(encoding="ascii").split())
              for path in parts
          )
          alphabet = frozenset(
              "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
              "abcdefghijklmnopqrstuvwxyz"
              "0123456789+/="
          )
          invalid = [
              (index, character)
              for index, character in enumerate(encoded)
              if character not in alphabet
          ]
          if invalid:
              raise SystemExit(f"invalid base64 transport characters: {invalid[:8]}")
          if "=" in encoded.rstrip("="):
              raise SystemExit("base64 padding appears before the stream terminus")
          normalized = encoded.rstrip("=")
          normalized += "=" * (-len(normalized) % 4)
          payload = base64.b64decode(normalized, validate=True)
          print(
              f"payload_bytes={len(payload)} "
              f"payload_sha256={hashlib.sha256(payload).hexdigest()}"
          )

          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          expanded = decompressor.decompress(payload)
          expanded += decompressor.flush()
          print(
              f"gzip_eof={decompressor.eof} "
              f"expanded_bytes={len(expanded)} "
              f"expanded_sha256={hashlib.sha256(expanded).hexdigest()}"
          )

          offset = 0
          member_index = 0
          zero_blocks = 0
          while offset + 512 <= len(expanded):
              header = expanded[offset : offset + 512]
              if header == bytes(512):
                  zero_blocks += 1
                  print(f"zero_block offset={offset} count={zero_blocks}")
                  offset += 512
                  if zero_blocks == 2:
                      break
                  continue
              zero_blocks = 0
              stored_field = header[148:156].rstrip(b"\0 ").lstrip()
              stored_checksum = int(stored_field or b"0", 8)
              calculated_checksum = (
                  sum(header[:148]) + (32 * 8) + sum(header[156:])
              )
              name = header[:100].split(b"\0", 1)[0].decode(
                  "utf-8", errors="replace"
              )
              prefix = header[345:500].split(b"\0", 1)[0].decode(
                  "utf-8", errors="replace"
              )
              if prefix:
                  name = f"{prefix}/{name}"
              size_field = header[124:136].rstrip(b"\0 ").lstrip()
              size = int(size_field or b"0", 8)
              typeflag = header[156:157].decode("ascii", errors="replace") or "0"
              data_start = offset + 512
              data_end = data_start + size
              available = max(0, min(size, len(expanded) - data_start))
              complete = data_end <= len(expanded)
              print(
                  f"member[{member_index}] offset={offset} name={name!r} "
                  f"type={typeflag!r} size={size} available={available} "
                  f"complete={complete} header_checksum_ok="
                  f"{stored_checksum == calculated_checksum}"
              )
              if complete:
                  content = expanded[data_start:data_end]
                  print(
                      f"member[{member_index}] sha256="
                      f"{hashlib.sha256(content).hexdigest()}"
                  )
                  safe_name = Path(name).name
                  Path(f"/tmp/{safe_name}").write_bytes(content)
              else:
                  break
              offset = data_start + ((size + 511) // 512) * 512
              member_index += 1

          print(
              f"parser_offset={offset} expanded_remaining="
              f"{max(0, len(expanded) - offset)}"
          )
          raise SystemExit("diagnostic transport remains fail closed")
          PY
