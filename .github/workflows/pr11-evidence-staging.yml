name: PR 11 evidence promotion

on:
  push:
    branches:
      - agent/v0.12-chipyard-rv64gc-lifecycle

permissions:
  contents: write

concurrency:
  group: pr11-evidence-staging
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.12-chipyard-rv64gc-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Promote and validate the sealed evidence tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "bf0ec047d1cebf8e018430e0d3d5201ec8115e9a"
          python - <<'PY'
          from pathlib import Path

          staged_path = Path(".staging/pr11-chipyard-lifecycle.yml")
          active_path = Path(".github/workflows/chipyard-lifecycle.yml")
          workflow = staged_path.read_text(encoding="utf-8")

          old_kit = '''          find "$ROOT" -maxdepth 1 -type f -print | sort \\
            > "$ROOT/kit/root-artifacts.txt"
          while IFS= read -r file; do sha256sum "$file"; done \\
            < "$ROOT/kit/root-artifacts.txt" \\
            > "$ROOT/kit/root-artifacts.sha256"
'''
          new_kit = '''          (
            cd "$ROOT"
            find . -maxdepth 1 -type f -print | sort \\
              > kit/root-artifacts.txt
            while IFS= read -r file; do sha256sum "$file"; done \\
              < kit/root-artifacts.txt \\
              > kit/root-artifacts.sha256
            sha256sum -c kit/root-artifacts.sha256
          )
'''
          if workflow.count(old_kit) != 1:
              raise SystemExit("staged kit checksum block changed unexpectedly")
          workflow = workflow.replace(old_kit, new_kit)

          old_root = '''          find "$ROOT" -maxdepth 1 -type f \\
            ! -name SHA256SUMS \\
            ! -name SHA256SUMS.sha256 \\
            -exec sha256sum {} \\; \\
            | sort > "$ROOT/SHA256SUMS"
          sha256sum "$ROOT/SHA256SUMS" > "$ROOT/SHA256SUMS.sha256"
          sha256sum -c "$ROOT/SHA256SUMS"
          sha256sum -c "$ROOT/SHA256SUMS.sha256"
'''
          new_root = '''          (
            cd "$ROOT"
            find . -maxdepth 1 -type f \\
              ! -name SHA256SUMS \\
              ! -name SHA256SUMS.sha256 \\
              -exec sha256sum {} \\; \\
              | sort > SHA256SUMS
            sha256sum SHA256SUMS > SHA256SUMS.sha256
            sha256sum -c SHA256SUMS
            sha256sum -c SHA256SUMS.sha256
          )
'''
          if workflow.count(old_root) != 1:
              raise SystemExit("staged root checksum block changed unexpectedly")
          workflow = workflow.replace(old_root, new_root)
          active_path.write_text(workflow, encoding="utf-8")

          tests_path = Path("tests/test_release_workflow.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_assertions = '''    assert "! -name SHA256SUMS" in workflow
    assert 'sha256sum "$ROOT/SHA256SUMS" > "$ROOT/SHA256SUMS.sha256"' in workflow
    assert 'sha256sum -c "$ROOT/SHA256SUMS"' in workflow
    assert 'sha256sum -c "$ROOT/SHA256SUMS.sha256"' in workflow
'''
          new_assertions = '''    assert "find . -maxdepth 1 -type f -print | sort" in workflow
    assert "> kit/root-artifacts.txt" in workflow
    assert "< kit/root-artifacts.txt" in workflow
    assert "> kit/root-artifacts.sha256" in workflow
    assert "sha256sum -c kit/root-artifacts.sha256" in workflow
    assert "! -name SHA256SUMS" in workflow
    assert "| sort > SHA256SUMS" in workflow
    assert "sha256sum SHA256SUMS > SHA256SUMS.sha256" in workflow
    assert "sha256sum -c SHA256SUMS" in workflow
    assert "sha256sum -c SHA256SUMS.sha256" in workflow
    assert '> "$ROOT/kit/root-artifacts.txt"' not in workflow
    assert '| sort > "$ROOT/SHA256SUMS"' not in workflow
'''
          if tests.count(old_assertions) != 1:
              raise SystemExit("workflow checksum assertions changed unexpectedly")
          tests_path.write_text(
              tests.replace(old_assertions, new_assertions),
              encoding="utf-8",
          )
          PY
          git rm \
            .staging/pr11-chipyard-lifecycle.yml \
            .github/workflows/pr11-evidence-staging.yml
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          mypy
          python scripts/repository_audit.py
          pytest -q
          git diff --check
          git config user.name 'BigBirdReturns Evidence Promoter'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add \
            .github/workflows/chipyard-lifecycle.yml \
            tests/test_release_workflow.py
          git commit -m 'Promote sealed Chipyard lifecycle proof custody'
          git push origin HEAD:agent/v0.12-chipyard-rv64gc-lifecycle
          git rev-parse HEAD
